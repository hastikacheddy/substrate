# Proton transfer as the chemistry of one enzyme in a metabolic pathway, followed all the way to the pathway flux:
# electronic -> quantum -> reaction -> biophysical -> biological.
#
#   external substrate --transport--> S --enzyme--> P --drain--> (out)
#
# The enzyme's chemical step is computed by the scales below; its binding/release rates, abundance, and the rest of
# the pathway are inputs given as `context.*` parameters that the pipeline carries across every scale untouched.
# The metabolic module is a well-mixed deterministic compartment at steady state, with no regulation or expression.
# Everything is illustrative, not fitted to any organism.
experiment:
  id: EXP-PT-005
  phenomenon: pathway_flux_from_proton_transfer

  system:
    name: proton-transfer enzyme in a pathway
    scale: electronic_structure
    kind: electronic.evb_two_state          # 1D electronic kind: the only route from here is through the quantum scale
    parameters:
      donor_acceptor_distance: {value: 2.50, unit: angstrom}
      morse_depth:             {value: 4.6,  unit: eV}
      morse_alpha:             {value: 2.2,  unit: 1/angstrom}
      morse_r_eq:              {value: 0.96, unit: angstrom}
      coupling:                {value: 0.6,  unit: eV}
      diabatic_offset:         {value: 0.05, unit: eV}
      particle_mass:           {value: 1.007276, unit: amu}
      temperature:             {value: 300,  unit: K}

      # enzyme: binding and release (biophysical inputs)
      context.k_on:            {value: 1.0e7, unit: 1/(M s)}
      context.k_off:           {value: 1.0e3, unit: 1/s}
      context.k_release:       {value: 1.0e4, unit: 1/s}
      context.k_on_product:    {value: 1.0e6, unit: 1/(M s)}   # product rebinding: makes the enzyme reversible
      context.substrate:       {value: 1.0e-4, unit: M}        # concentration for the single-enzyme turnover readout

      # the cell: enzyme abundance and the rest of the pathway (biological inputs)
      context.enzyme_total:       {value: 1.0e-6, unit: M, sigma: 2.0e-7}     # expression level is the uncertain input
      context.external_substrate: {value: 1.0e-3, unit: M}
      context.transport_rate:     {value: 5.0,    unit: 1/s}
      context.drain_vmax:         {value: 2.0e-3, unit: M/s}
      context.drain_km:           {value: 1.0e-4, unit: M}

  propagation: [biological]

  ensemble:
    n_samples: 40
    seed: 7
