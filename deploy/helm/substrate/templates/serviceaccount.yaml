# The platform never calls the Kubernetes API, so its pods get no service-account token at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "substrate.partOf" . | nindent 4 }}
automountServiceAccountToken: false
---
# The artifact store. The API and every worker read and write it, so it must be shared storage: ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: substrate-artifacts
  labels:
    {{- include "substrate.partOf" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep          # the artifacts are the scientific record: `helm uninstall` must not delete them (delete this claim yourself when you mean to)
spec:
  accessModes: {{ toJson .Values.artifacts.accessModes }}
  {{- if .Values.artifacts.storageClassName }}
  storageClassName: {{ .Values.artifacts.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.artifacts.size }}
