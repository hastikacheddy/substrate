# Prometheus: scrapes the API's /metrics with an OPERATOR's API key (read from a mounted secret file, never written here).
# The workers have no metrics endpoint of their own. What they do reaches the API's /metrics through the database (the substrate_*_recent gauges), and their
# per-task counters and timings are in their JSON logs and, if a collector is configured, as trace spans.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: substrate-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_token
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: substrate-api
