apiVersion: v1
kind: Service
metadata:
  name: substrate-api
  namespace: substrate
  labels: {app.kubernetes.io/name: substrate-api, app.kubernetes.io/part-of: substrate}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: substrate-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-api
  namespace: substrate
  labels: {app.kubernetes.io/name: substrate-api, app.kubernetes.io/part-of: substrate}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: substrate-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: substrate-api, app.kubernetes.io/part-of: substrate}
    spec:
      serviceAccountName: substrate
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: substrate:dev
          imagePullPolicy: IfNotPresent
          args: ["platform", "serve", "--host", "0.0.0.0", "--allow-external"]       # plain HTTP inside the cluster: terminate TLS at the ingress
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SUBSTRATE_DB_FILE, value: /run/secrets/db_url}
            - {name: SUBSTRATE_STORE, value: /data/artifacts}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: artifacts, mountPath: /data/artifacts}
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: substrate-artifacts}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: secrets
          secret:
            secretName: substrate-secrets
            defaultMode: 0440
            items:
              - {key: db_url, path: db_url}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: substrate-api
  namespace: substrate
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: substrate-api}
