name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"          # weekly: new advisories appear without any change to the code

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev-lock.txt
            requirements-platform-lock.txt
      - name: Install (versions constrained by the lock files)
        run: pip install -e ".[dev,platform,postgres,otlp,redis,s3]" -c requirements-dev-lock.txt -c requirements-platform-lock.txt
      - name: Tests that do not need a quantum-chemistry program
        run: python -m pytest -m "not qc" -q

  core-only:
    name: tests without the platform extras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install the scientific core only (the control plane's tests must skip, not fail)
        run: pip install -e ".[dev]" -c requirements-dev-lock.txt
      - run: python -m pytest -m "not qc" -q -rs

  quantum:
    name: quantum providers (Qiskit emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev-lock.txt
            requirements-platform-lock.txt
      - name: Install with the qiskit extra (under the locked numpy and scipy)
        run: pip install -e ".[dev,platform,qiskit]" -c requirements-dev-lock.txt -c requirements-platform-lock.txt
      - name: The Qiskit providers, on Aer and on emulated IBM devices (no real device, no credentials)
        run: python -m pytest tests/test_qpu_qiskit.py tests/test_qpu.py tests/test_qpu_more.py -q -rs

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - name: Build (nothing is pushed)
        run: docker build -f deploy/Dockerfile -t substrate:ci .
      - name: It runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id substrate:ci -u)" = "10001"
      - name: It starts under the same restrictions the deployment applies (read-only root, no capabilities, no new privileges)
        run: |
          RUN="docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=64m -e SUBSTRATE_DB=sqlite:////tmp/ci.sqlite3 -e SUBSTRATE_STORE=/tmp/artifacts"
          $RUN substrate:ci platform --help > /dev/null
          $RUN --entrypoint sh substrate:ci -c 'python -m substrate platform init --tenant ci > /dev/null && python -m substrate platform worker --until-idle'
      - name: The API refuses to listen beyond loopback without being told to
        run: |
          if docker run --rm --read-only --cap-drop ALL --tmpfs /tmp -e SUBSTRATE_DB=sqlite:////tmp/ci.sqlite3 -e SUBSTRATE_STORE=/tmp/a substrate:ci platform serve --host 0.0.0.0; then
            echo "the API started on 0.0.0.0 without --allow-external"; exit 1
          fi

  audit:
    name: dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the audit and SBOM tools
        run: pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0
      - name: Known vulnerabilities in the pinned runtime dependencies
        run: pip-audit -r requirements-lock.txt --strict
      - name: Known vulnerabilities in the control plane's pinned dependencies (the container image installs these)
        run: pip-audit -r requirements-platform-lock.txt --strict
      - name: Known vulnerabilities in the pinned test dependencies
        run: pip-audit -r requirements-dev-lock.txt --strict
      - name: Software bill of materials (CycloneDX)
        run: cyclonedx-py requirements requirements-lock.txt --of JSON -o sbom.cdx.json
      - name: Software bill of materials for the control plane (CycloneDX)
        run: |
          cyclonedx-py requirements requirements-platform-lock.txt --of JSON -o sbom-platform.cdx.json
          python - <<'EOF'
          import json
          names = {c["name"].lower().replace("_", "-") for c in json.load(open("sbom-platform.cdx.json"))["components"]}
          missing = {"sqlalchemy", "fastapi", "uvicorn", "pydantic", "prometheus-client", "opentelemetry-sdk", "psycopg2-binary", "numpy"} - names
          assert not missing, f"missing from the control plane's SBOM: {sorted(missing)}"
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom-platform.cdx.json
          if-no-files-found: error

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: high
