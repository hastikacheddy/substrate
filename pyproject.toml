[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "substrate"
version = "0.1.0"
description = "Propagate scientific models across scales through a common intermediate representation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.7"]          # only for the benchmark figure in examples/benchmark_bifluoride.py

[project.scripts]
substrate = "substrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
substrate = ["gui/static/*", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["qc: needs a real quantum-chemistry program (PySCF, via WSL on Windows)"]
pythonpath = ["src"]
