[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "substrate"
version = "0.1.0"
description = "Multiscale scientific computing: propagate models from quantum chemistry to biology through one validated representation, with an optional multi-tenant control plane."
requires-python = ">=3.10"
keywords = ["scientific computing", "multiscale modelling", "quantum chemistry", "reproducibility", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/hastikacheddy/substrate"
Documentation = "https://github.com/hastikacheddy/substrate/blob/main/docs/platform.md"
Issues = "https://github.com/hastikacheddy/substrate/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]       # httpx drives the API in the tests
platform = [                              # the control plane (substrate.control); the scientific core needs none of this
    "sqlalchemy>=1.4.40", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "prometheus-client>=0.19",
    "opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24",
]
postgres = ["psycopg2-binary>=2.9"]       # the driver for a PostgreSQL registry (SQLite needs none)
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]   # workers send traces to an OpenTelemetry collector
s3 = ["boto3>=1.34"]                      # for an S3-compatible artifact store (MinIO, AWS)
redis = ["redis>=5"]                      # workers wake on a Redis notification instead of polling the database every half second
qiskit = ["qiskit>=1.2", "qiskit-aer>=0.17.2", "qiskit-ibm-runtime>=0.30"]   # quantum providers: Aer, emulated IBM devices, and IBM's devices (see substrate.qpu_qiskit)
plots = ["matplotlib>=3.7"]          # only for the benchmark figure in examples/benchmark_bifluoride.py

[project.scripts]
substrate = "substrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
substrate = ["gui/static/*", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["qc: needs a real quantum-chemistry program (PySCF, via WSL on Windows)"]
pythonpath = ["src"]
