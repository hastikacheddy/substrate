apiVersion: v1
kind: Service
metadata:
  name: substrate-api
  labels:
    app.kubernetes.io/name: substrate-api
    {{- include "substrate.partOf" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: substrate-api
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-api
  labels:
    app.kubernetes.io/name: substrate-api
    {{- include "substrate.partOf" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-api
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: substrate-api
        {{- include "substrate.partOf" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "substrate.podSecurityContext" (dict "user" 10001) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "substrate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["platform", "serve", "--host", "0.0.0.0", "--allow-external"]       # plain HTTP inside the cluster: terminate TLS at the ingress
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SUBSTRATE_DB_FILE, value: /run/secrets/db_url}
            - {name: SUBSTRATE_STORE, value: /data/artifacts}
          securityContext:
            {{- include "substrate.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: artifacts, mountPath: /data/artifacts}
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: substrate-artifacts}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440
            items:
              - {key: db_url, path: db_url}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: substrate-api
  labels:
    {{- include "substrate.partOf" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-api
